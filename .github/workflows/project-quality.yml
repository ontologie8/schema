name: Schema-Projektprüfung

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verifizierte Pilotabhängigkeiten installieren
        run: python -m pip install -r requirements.txt
      - name: Projektstruktur, Links und Roadmap-Umfang prüfen
        run: python scripts/validate_project.py
      - name: Schema, Module und RDF-Abbildung prüfen
        run: python scripts/pruefe_pilot.py
      - name: Synthetische Erbausschlagungsfälle und RDF-Rückwege prüfen
        run: python scripts/pruefe_erbausschlagung.py
      - name: Allgemeine Fachmodule, Profile und Versionsbindungen prüfen
        run: python scripts/pruefe_module.py --paket pakete/0.1.1/paket.json
      - name: Unabhängige Modell- und Erwartungsfälle prüfen
        run: python -m unittest discover -s tests -v
